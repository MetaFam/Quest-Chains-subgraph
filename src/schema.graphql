type Factory @entity {
  id: ID!
  address: Bytes!
  chainTemplateAddress: Bytes!
  shelfTemplateAddress: Bytes!
  collectionTemplateAddress: Bytes!
  tokenAddress: Bytes!
  adminAddress: Bytes!
  treasuryAddress: Bytes!
  paymentToken: ERC20Token!
  upgradeFee: BigInt!
  questChainCount: Int!
}

type ERC20Token @entity {
  id: ID!
  name: String!
  symbol: String!
  decimals: Int!
}

type QuestChainToken @entity {
  id: ID!
  network: Int!
  questChain: QuestChain!
  tokenId: BigInt!
  tokenAddress: Bytes!
  details: QuestChainTokenMetadata!
  owners: [User!]!
}

type QuestChainTokenMetadata @entity(immutable: true) {
  id: ID!
  name: String
  description: String
  image: String
  animationURL: String
  externalURL: String
  mimeType: String
}

type QuestChain @entity {
  id: ID!
  network: Int!
  paused: Boolean!
  address: Bytes!
  factory: Factory!
  numCompletedQuesters: Int!
  completedQuesters: [User!]!
  numQuesters: Int!
  questers: [User!]!
  owners: [User!]!
  admins: [User!]!
  reviewers: [User!]!
  editors: [User!]!
  creator: User!
  createdAt: Timestamp!
  updatedAt: Timestamp!
  editedBy: User
  editedAt: Timestamp
  creationTxHash: Bytes!
  details: QuestChainMetadata
  questsPassed: [QuestStatus!]!
  questsFailed: [QuestStatus!]!
  questsInReview: [QuestStatus!]!
  questCount: Int! # includes number of quests which are not paused
  totalQuestCount: Int! # includes all quests
  quests: [Quest!]! @derivedFrom(field: "questChain")
  edits: [QuestChainEdit!]! @derivedFrom(field: "questChain")
  status: [QuestStatus!]! @derivedFrom(field: "questChain")
  submittedProofs: [ProofSubmission!]! @derivedFrom(field: "questChain")
  submittedReviews: [ReviewSubmission!]! @derivedFrom(field: "questChain")
  token: QuestChainToken! @derivedFrom(field: "questChain")
  version: String!
  premium: Boolean!
}

type QuestChainMetadata @entity(immutable: true) {
  id: ID!
  name: String
  description: String
  image: String
  externalURL: String
  slug: String
  categories: [Category!]
  questChain: QuestChain! @derivedFrom(field: "details")
}

type Category @entity(immutable: true) {
  id: ID!
  name: String!
}

type QuestChainEdit @entity {
  id: ID!
  questChain: QuestChain!
  editor: User!
  timestamp: Timestamp!
  txHash: Bytes!
  details: QuestChainMetadata
}

type Quest @entity {
  id: ID!
  optional: Boolean!
  skipReview: Boolean!
  paused: Boolean!
  questChain: QuestChain!
  questId: BigInt!
  numCompletedQuesters: Int!
  completedQuesters: [User!]!
  numQuesters: Int!
  questers: [User!]!
  details: QuestMetadata!
  creator: User!
  createdAt: Timestamp!
  updatedAt: Timestamp!
  editedBy: User
  editedAt: Timestamp
  creationTxHash: Bytes!
  usersPassed: [QuestStatus!]!
  usersFailed: [QuestStatus!]!
  usersInReview: [QuestStatus!]!
  status: [QuestStatus!]! @derivedFrom(field: "quest")
  edits: [QuestEdit!]! @derivedFrom(field: "quest")
  submittedProofs: [ProofSubmission!]! @derivedFrom(field: "quest")
  submittedReviews: [ReviewSubmission!]! @derivedFrom(field: "quest")
}

type _Schema_
  @fulltext(
    name: "questSearch"
    language: en
    algorithm: proximityRank
    include: [
      {
        entity: "QuestMetadata",
        fields: [
          { name: "name" },
          { name: "description" }
        ]
      },
    ]
  )
  @fulltext(
    name: "chainSearch"
    language: en
    algorithm: proximityRank
    include: [
      {
        entity: "QuestChainMetadata",
        fields: [
          { name: "name" },
          { name: "description" }
        ]
      },
    ]
  )
  @fulltext(
    name: "shelfSearch"
    language: en
    algorithm: proximityRank
    include: [
      {
        entity: "ShelfMetadata",
        fields: [
          { name: "name" },
          { name: "description" }
        ]
      },
    ]
  )

type QuestMetadata @entity(immutable: true) {
  id: ID!
  quest: Quest! @derivedFrom(field: "details")
  name: String
  description: String
  image: String
  externalURL: String
}

type QuestEdit @entity {
  id: ID!
  quest: Quest!
  editor: User!
  timestamp: Timestamp!
  txHash: Bytes!
  details: QuestMetadata!
}

type User @entity {
  id: Bytes!
  questsPassed: [QuestStatus!]!
  questsFailed: [QuestStatus!]!
  questsInReview: [QuestStatus!]!
  questEdits: [QuestEdit!]! @derivedFrom(field: "editor")
  ownerOf: [QuestChain!]! @derivedFrom(field: "owners")
  adminOf: [QuestChain!]! @derivedFrom(field: "admins")
  editorOf: [QuestChain!]! @derivedFrom(field: "editors")
  reviewerOf: [QuestChain!]! @derivedFrom(field: "reviewers")
  status: [QuestStatus!]! @derivedFrom(field: "user")
  submittedProofs: [ProofSubmission!]! @derivedFrom(field: "user")
  submittedReviews: [ReviewSubmission!]! @derivedFrom(field: "reviewer")
  tokens: [QuestChainToken!]! @derivedFrom(field: "owners")
  completedQuests: [Quest!]! @derivedFrom(field: "completedQuesters")
  completedQuestChains: [QuestChain!]! @derivedFrom(field: "completedQuesters")
}

enum Status {
  init
  review
  pass
  fail
}

type QuestStatus @entity {
  id: ID!
  quest: Quest!
  questChain: QuestChain!
  user: User!
  status: Status!
  updatedAt: Timestamp!
  submissions: [ProofSubmission!]!
  reviews: [ReviewSubmission!]! @derivedFrom(field: "questStatus")
}

type ProofSubmission @entity {
  id: ID!
  quest: Quest!
  questChain: QuestChain!
  questStatus: QuestStatus!
  user: User!
  details: SubmissionMetadata!
  timestamp: Timestamp!
  txHash: Bytes!
}

type SubmissionMetadata @entity(immutable: true) {
  id: ID!
  name: String
  description: String
  image: String
  externalURL: String
}

type ReviewSubmission @entity {
  id: ID!
  quest: Quest!
  questChain: QuestChain!
  questStatus: QuestStatus!
  proof: ProofSubmission
  accepted: Boolean!
  user: User!
  reviewer: User!
  details: SubmissionMetadata!
  timestamp: Timestamp!
  txHash: Bytes!
}

type Shelf @entity {
  id: ID!
  network: Int!
  tokenId: BigInt! @unique
  address: Bytes!
  factory: Factory!
  creator: User!
  admins: [User!]!
  createdAt: Timestamp!
  updatedAt: Timestamp!
  creationTxHash: Bytes!
  details: ShelfMetadata
  contents: [QuestChain!]
}

type ShelfMetadata @entity(immutable: true) {
  id: ID!
  name: String
  description: String
  cover: String
  slug: String
  categories: [Category!]
  shelf: Shelf! @derivedFrom(field: "details")
}

type Collection @entity {
  id: ID!
  network: Int!
  address: Bytes!
  factory: Factory!
  creator: User!
  admins: [User!]!
  createdAt: Timestamp!
  updatedAt: Timestamp!
  creationTxHash: Bytes!
  details: CollectionMetadata
  contents: [Shelf!]
}

type CollectionMetadata @entity(immutable: true) {
  id: ID!
  name: String
  description: String
  cover: String
  slug: String
  categories: [Category!]
  collection: Collection! @derivedFrom(field: "details")
}
